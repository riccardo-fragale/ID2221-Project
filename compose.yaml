name: id2221-recommender
services:
  mongodb:
    image: mongo:8.2.12  # 8.0 refuses to start on Linux kernel >= 6.19 (SERVER-121912)
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set a username in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set a password in .env}
    volumes:
      - mongodb_data:/data/db
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  mongodb_data:
