# Approved local development topology, 2026-10-23.
# Fixture and development profile; the measured full-category runs used configs/real.toml.
profile = "local"
seed = 2221
storage_root = "../storage"

[spark]
master = "local[2]"
driver_memory = "2g"
shuffle_partitions = 4
event_log_enabled = false

[mongo]
database = "amazon_recommender"
uri_env = "MONGODB_URI"

# Example fixture settings: edit the fraction/split for each development run.
# Fraction 1 means all users in the chosen input file, not a full-data download.
[experiment]
purpose = "exploratory"
user_fraction = 1.0
split = [0.8, 0.1, 0.1]
user_min_reviews = 5
item_min_reviews = 5
relevant_rating = 4.0

# One starting configuration, not an approved full-data tuning grid.
[model]
rank = 10
regularization = 0.1
iterations = 10
bias_regularization = 10.0
bias_max_passes = 10
bias_tolerance = 0.0001
popularity_smoothing = 10.0
popularity_window_days = "all"  # or a positive number of days before the end of training
recommendation_count = 20
num_user_blocks = 10  # Spark ALS default; fixed so factors are comparable across runs
num_item_blocks = 10
