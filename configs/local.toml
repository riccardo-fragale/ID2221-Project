# Approved local development topology, 2026-10-23.
# Resource measurements and full-category execution remain pending.
profile = "local"
seed = 2221
storage_root = "../storage"

[spark]
master = "local[2]"
driver_memory = "2g"
shuffle_partitions = 4
event_log_enabled = false

[mongo]
database = "amazon_recommender"
uri_env = "MONGODB_URI"

# Example fixture settings: edit the fraction/split for each development run.
# Fraction 1 means all users in the chosen input file, not a full-data download.
[experiment]
purpose = "exploratory"
user_fraction = 1.0
split = [0.8, 0.1, 0.1]
user_min_reviews = 5
item_min_reviews = 5
relevant_rating = 4.0

# One starting configuration, not an approved full-data tuning grid.
[model]
rank = 10
regularization = 0.1
iterations = 10
bias_regularization = 10.0
bias_max_passes = 10
bias_tolerance = 0.0001
popularity_smoothing = 10.0
recommendation_count = 20
shortlist_size = 200
shortlist_cap = 1000
