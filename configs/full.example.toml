# Template only: supply a reviewed cluster master and shared storage URI.
profile = "full"
seed = 2221
storage_root = "REQUIRES_SHARED_STORAGE"

[spark]
master = "REQUIRES_CLUSTER_MASTER"
driver_memory = "2g"
shuffle_partitions = 4
event_log_enabled = true

[mongo]
database = "amazon_recommender"
uri_env = "MONGODB_URI"

[experiment]
purpose = "final"
user_fraction = 1.0
split = [0.8, 0.1, 0.1]
user_min_reviews = 5
item_min_reviews = 5
relevant_rating = 4.0

# Template values only; freeze selected hyperparameters before final evaluation.
[model]
rank = 10
regularization = 0.1
iterations = 10
bias_regularization = 10.0
bias_max_passes = 10
bias_tolerance = 0.0001
popularity_smoothing = 10.0
popularity_window_days = "all"  # or a positive number of days before the end of training
recommendation_count = 20
num_user_blocks = 10  # Spark ALS default; fixed so factors are comparable across runs
num_item_blocks = 10
